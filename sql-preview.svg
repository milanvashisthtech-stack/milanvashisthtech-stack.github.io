<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560"><rect width="900" height="560" rx="24" fill="#f4f8fc"/><rect x="0" y="0" width="900" height="82" rx="24" fill="#082e63"/><text x="42" y="43" font-family="Arial,sans-serif" font-size="27" font-weight="800" fill="#fff">SQL · BUSINESS ANALYSIS</text><text x="42" y="66" font-family="Arial,sans-serif" font-size="13" fill="#bcd5ef">UPI Transaction Analytics · actual SQL analysis file</text><text x="42" y="125" font-family="Arial" font-size="16" font-weight="700" fill="#17324f">05_SQL_Analysis.sql</text><rect x="42" y="145" width="816" height="235" rx="14" fill="#10233c"/><text x="65" y="172" font-family="monospace" font-size="12" fill="#dcecff">-- Executive KPI Dashboard</text><text x="65" y="192" font-family="monospace" font-size="12" fill="#dcecff">SELECT COUNT(*) AS Total_Transactions</text><text x="65" y="212" font-family="monospace" font-size="12" fill="#dcecff">FROM upi_transaction_history;</text><text x="65" y="232" font-family="monospace" font-size="12" fill="#dcecff"></text><text x="65" y="252" font-family="monospace" font-size="12" fill="#dcecff">-- Fraud Rate</text><text x="65" y="272" font-family="monospace" font-size="12" fill="#dcecff">SELECT ROUND((COUNT(CASE WHEN fraud_flag='TRUE' THEN 1 END)</text><text x="65" y="292" font-family="monospace" font-size="12" fill="#dcecff"> * 100.0) / COUNT(*),2) AS Fraud_Rate</text><text x="65" y="312" font-family="monospace" font-size="12" fill="#dcecff">FROM upi_transaction_history;</text><text x="65" y="332" font-family="monospace" font-size="12" fill="#dcecff"></text><text x="65" y="352" font-family="monospace" font-size="12" fill="#dcecff">-- Monthly Transaction Trend</text><text x="65" y="372" font-family="monospace" font-size="12" fill="#dcecff">SELECT MONTH(timestamp), COUNT(*), ROUND(SUM(amount),2)</text><text x="65" y="392" font-family="monospace" font-size="12" fill="#dcecff">FROM upi_transaction_history GROUP BY MONTH(timestamp);</text><rect x="42" y="400" width="245" height="74" rx="12" fill="#e8f1fa"/><text x="60" y="430" font-family="Arial" font-size="24" font-weight="800" fill="#1267d8">45</text><text x="60" y="452" font-family="Arial" font-size="12" fill="#60758b">analysis queries</text><rect x="305" y="400" width="245" height="74" rx="12" fill="#e8f1fa"/><text x="323" y="430" font-family="Arial" font-size="24" font-weight="800" fill="#1267d8">6+</text><text x="323" y="452" font-family="Arial" font-size="12" fill="#60758b">analysis areas</text><rect x="568" y="400" width="290" height="74" rx="12" fill="#e8f1fa"/><text x="586" y="430" font-family="Arial" font-size="17" font-weight="800" fill="#17324f">KPI · Customer · Merchant</text><text x="586" y="452" font-family="Arial" font-size="12" fill="#60758b">Device · Fraud · Operations</text></svg>